[package]
name = "celeste-mobile"
version = "0.1.0"
description = "Celeste Overlay — Android"
edition = "2021"

[lib]
name = "celeste_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
riot-core = { path = "../../riot-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
