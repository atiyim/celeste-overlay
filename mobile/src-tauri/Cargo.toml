[package]
name = "celeste-mobile"
version = "0.1.0"
description = "Celeste Overlay — Android"
edition = "2021"

[lib]
name = "celeste_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
riot-core = { path = "../../riot-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"

[features]
# Emülatör testi için: hesap değiştirme adımlarını uygulama kendisi dener. Dağıtılan APK'da kapalı.
selftest = []

# Telefonda boyut önemli: boyut için optimize, hata ayıklama bilgisi yok, tek parça bağlama.
# panic = "abort" kullanılmaz: bir arka plan işindeki hata bütün uygulamayı kapatmasın.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
