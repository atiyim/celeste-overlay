[package]
name = "celeste-mobile"
version = "0.1.0"
description = "Celeste Overlay — Android"
edition = "2021"

[lib]
name = "celeste_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
riot-core = { path = "../../riot-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Telefonda boyut önemli: boyut için optimize, hata ayıklama bilgisi yok, tek parça bağlama.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
