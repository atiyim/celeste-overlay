name: Test derlemesi

# "test/..." dalına gönderilince çalışır: Windows kurulum dosyasını derler ve TASLAK sürüme koyar.
# Taslak sürümü yalnızca depo sahibi görür; kullanıcılara güncelleme olarak gitmez.
on:
  push:
    branches: ["test/**"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: pnpm install --no-frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: test-build-${{ github.run_number }}
          releaseName: "TEST ${{ github.run_number }}: ${{ github.ref_name }}"
          releaseBody: "Yalnızca test için, herkese açık değil. Kullanıcılara güncelleme olarak gitmez."
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false
