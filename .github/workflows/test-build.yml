name: Deneme derlemesi

# Yayınlamadan denemek için: Windows kurulum dosyasını derler ve yalnızca Actions'a yükler.
# Sürüm yayınlanmaz, latest.json değişmez, kullanıcılara güncelleme gitmez.
# Çalıştırma: Actions → Deneme derlemesi → Run workflow (ya da "test-build" dalına gönder).
on:
  workflow_dispatch:
  push:
    branches: ["test-build"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: pnpm install --no-frozen-lockfile
      # Güncelleme imzası gerekmez: deneme kurulumu güncelleme dosyası üretmez.
      - name: Derle
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/test.json"
          pnpm tauri build --bundles nsis --config "$RUNNER_TEMP/test.json"
      - uses: actions/upload-artifact@v4
        with:
          name: celeste-overlay-deneme
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
