name: Deneme derlemesi

# Yayınlamadan denemek için: Windows kurulum dosyasını derler ve yalnızca Actions'a yükler.
# Sürüm yayınlanmaz, latest.json değişmez, kullanıcılara güncelleme gitmez.
# Çalıştırma: Actions → Deneme derlemesi → Run workflow (ya da "test-build" dalına gönder).
on:
  workflow_dispatch:
    inputs:
      resmi_degil:
        description: "Anahtarsız derle (resmi olmayan derleme gibi davranır: lisans ekranını denemek için)"
        type: boolean
        default: false
  push:
    branches: ["test-build"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: pnpm install --no-frozen-lockfile
      # Güncelleme imzası gerekmez: deneme kurulumu güncelleme dosyası üretmez.
      - name: Resmi derleme anahtarı durumu
        shell: bash
        env:
          CELESTE_BUILD_MASTER: ${{ inputs.resmi_degil && '' || secrets.CELESTE_BUILD_MASTER }}
        run: |
          # Anahtar yoksa bu deneme derlemesi "resmi olmayan" çıkar: lisans ekranı gösterir, Celeste servislerine bağlanamaz.
          if [ -n "$CELESTE_BUILD_MASTER" ]; then echo "::notice::Resmi derleme anahtarı VAR: bu derleme resmi sayılır."; else echo "::warning::Resmi derleme anahtarı YOK: bu derleme resmi olmayan derleme olarak çıkar."; fi
      - name: Derle
        shell: bash
        env:
          # Uygulamadaki "Bu kurulumu doğrula" bu derlemeyi yayınlanmış sürümden ayırt etsin.
          CELESTE_CHANNEL: deneme
          CELESTE_BUILD_MASTER: ${{ inputs.resmi_degil && '' || secrets.CELESTE_BUILD_MASTER }}
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/test.json"
          pnpm tauri build --bundles nsis --config "$RUNNER_TEMP/test.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.resmi_degil && 'celeste-overlay-deneme-resmi-degil' || 'celeste-overlay-deneme' }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
