name: Android APK

# Elle çalıştır (Actions → Android APK → Run workflow) ya da "android-v0.1.0" gibi bir etiket gönder.
# İmza anahtarı (ANDROID_KEYSTORE…) varsa imzalı "release" APK, yoksa debug anahtarıyla imzalı APK çıkar.
# Not: farklı anahtarla imzalanmış APK, eskisinin üstüne kurulmaz; kalıcı dağıtımdan önce anahtarı ekle.
on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # Kökte masaüstü uygulamasının src-tauri'si de var: Gradle'ın çağırdığı tauri komutu yanlışını bulmasın.
      - name: Uygulama yolu
        run: |
          echo "TAURI_APP_PATH=$GITHUB_WORKSPACE/mobile/src-tauri" >> "$GITHUB_ENV"
          echo "TAURI_FRONTEND_PATH=$GITHUB_WORKSPACE/mobile" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Android SDK sunucuda hazır kurulu; yalnızca NDK ve derleme araçları eklenir.
      - name: NDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "mobile/src-tauri -> target"
      - run: pnpm install --no-frozen-lockfile

      - name: Android projesi
        working-directory: mobile
        run: |
          npx tauri android init --ci
          npx tauri icon ../src-tauri/icons/icon.png

      - name: İmza anahtarı
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/celeste.jks"; echo "signed=1" >> "$GITHUB_OUTPUT"; else echo "signed=0" >> "$GITHUB_OUTPUT"; fi

      - name: Derle (imzalı)
        if: steps.key.outputs.signed == '1'
        working-directory: mobile
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Derle (debug)
        if: steps.key.outputs.signed != '1'
        working-directory: mobile
        run: npx tauri android build --apk --debug --target aarch64 --target armv7

      - name: İmzala ve adlandır
        env:
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          OUT=mobile/src-tauri/gen/android/app/build/outputs/apk
          find "$OUT" -name '*.apk' -print
          V=$(node -p "require('./mobile/src-tauri/tauri.conf.json').version")
          mkdir -p dist-apk
          if [ "${{ steps.key.outputs.signed }}" = "1" ]; then
            SRC=$(find "$OUT" -name '*release-unsigned.apk' | head -1)
            "$BT/zipalign" -f -p 4 "$SRC" aligned.apk
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/celeste.jks" --ks-key-alias "$ALIAS" --ks-pass env:PASS --key-pass env:PASS --out "dist-apk/Celeste-$V.apk" aligned.apk
          else
            SRC=$(find "$OUT" -name '*debug.apk' | head -1)
            cp "$SRC" "dist-apk/Celeste-$V-debug.apk"
          fi
          "$BT/apksigner" verify --print-certs dist-apk/*.apk | head -5
          cd dist-apk && sha256sum *.apk | tee SHA256.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: celeste-apk
          path: dist-apk/*
      # Etiketle çalışınca o sürüme, elle çalışınca "android-latest" sürümüne eklenir (telefondan tek dokunuşla indirilir).
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'android-latest' }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Celeste Android ($TAG)" --notes "Android uygulaması (deneme). APK dosyasını telefondan indirip kur." --prerelease
          gh release upload "$TAG" dist-apk/* --clobber
