name: Android APK

# Elle çalıştır (Actions → Android APK → Run workflow) ya da "android-v0.1.0" gibi bir etiket gönder.
# İmza anahtarı (ANDROID_KEYSTORE…) varsa kalıcı anahtarla, yoksa geçici anahtarla imzalı "release" APK çıkar.
# Not: farklı anahtarla imzalanmış APK, eskisinin üstüne kurulmaz; kalıcı dağıtımdan önce anahtarı ekle.
on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # Kökte masaüstü uygulamasının src-tauri'si de var: Gradle'ın çağırdığı tauri komutu yanlışını bulmasın.
      # Etiketle derlenince sürüm numarası etiketten alınır (android-v0.2.0 → 0.2.0); uygulama içi güncelleme buna bakar.
      - name: Sürüm
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          V="${GITHUB_REF_NAME#android-v}"
          node -e "const f='mobile/src-tauri/tauri.conf.json',c=require('./'+f);c.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "$V"
          grep '"version"' mobile/src-tauri/tauri.conf.json
      - name: Uygulama yolu
        run: |
          echo "TAURI_APP_PATH=$GITHUB_WORKSPACE/mobile/src-tauri" >> "$GITHUB_ENV"
          echo "TAURI_FRONTEND_PATH=$GITHUB_WORKSPACE/mobile" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Android SDK sunucuda hazır kurulu; yalnızca NDK ve derleme araçları eklenir.
      - name: NDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "mobile/src-tauri -> target"
      - run: pnpm install --no-frozen-lockfile

      - name: Android projesi
        working-directory: mobile
        run: |
          npx tauri android init --ci
          npx tauri icon icon/app-icon.png

      # Kalıcı anahtar (ANDROID_KEYSTORE…) yoksa bu çalışmaya özel geçici anahtar üretilir: APK yine küçük ve hızlı
      # "release" derlemesidir, ama sonraki derlemeler onun üstüne kurulmaz (önce silmek gerekir).
      - name: İmza anahtarı
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/celeste.jks"
            { echo "KEY_ALIAS=$ALIAS"; echo "KEY_PASS=$PASS"; echo "APK_SUFFIX="; } >> "$GITHUB_ENV"
          else
            TMP=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/celeste.jks" -alias celeste -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$TMP" -keypass "$TMP" -dname "CN=Celeste test"
            echo "::add-mask::$TMP"
            { echo "KEY_ALIAS=celeste"; echo "KEY_PASS=$TMP"; echo "APK_SUFFIX=-test"; } >> "$GITHUB_ENV"
          fi

      - name: Derle
        working-directory: mobile
        # Telefonlar için arm64, BlueStacks gibi bilgisayar emülatörleri için x86_64: ayrı ayrı APK.
        run: npx tauri android build --apk --split-per-abi --target aarch64 --target x86_64

      - name: İmzala ve adlandır
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          OUT=mobile/src-tauri/gen/android/app/build/outputs/apk
          find "$OUT" -name '*.apk' -print
          V=$(node -p "require('./mobile/src-tauri/tauri.conf.json').version")
          mkdir -p dist-apk
          for SRC in $(find "$OUT" -name '*release-unsigned.apk'); do
            case "$SRC" in *x86_64*) ABI="emulator-x86_64";; *arm64*) ABI="telefon-arm64";; *) ABI="universal";; esac
            "$BT/zipalign" -f -p 4 "$SRC" aligned.apk
            "$BT/apksigner" sign --v4-signing-enabled false --ks "$RUNNER_TEMP/celeste.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_PASS --key-pass env:KEY_PASS --out "dist-apk/Celeste-$V$APK_SUFFIX-$ABI.apk" aligned.apk
          done
          for f in dist-apk/*.apk; do "$BT/apksigner" verify "$f"; done
          ls -la dist-apk
          cd dist-apk && sha256sum *.apk | tee SHA256.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: celeste-apk
          path: dist-apk/*

  # Çökme testi: x86_64 APK'sı Android 14 emülatöründe açılıp kapatılır (mobile/test/emulator.sh).
  # Uygulamaya hiçbir şey eklemez; yalnızca derlemenin sonunda çalışır. Çökme varsa derleme kırmızı olur ve sürüm yayınlanmaz.
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: celeste-apk
          path: dist-apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash mobile/test/emulator.sh "$(ls dist-apk/*emulator-x86_64.apk | head -1)" emu-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: emu-out

  # Yalnızca "android-v…" etiketiyle çalışınca ve çökme testi geçince herkese açık sürüme eklenir.
  # Elle çalışınca APK sadece Actions'ta kalır.
  release:
    needs: [apk, emulator]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: celeste-apk
          path: dist-apk
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Celeste Android ${TAG#android-v}" --notes "Telefonlar için **telefon-arm64**, BlueStacks gibi bilgisayar emülatörleri için **emulator-x86_64** APK dosyasını indirip kur."
          for f in $(gh release view "$TAG" --json assets -q '.assets[].name'); do gh release delete-asset "$TAG" "$f" -y; done
          gh release upload "$TAG" dist-apk/* --clobber
