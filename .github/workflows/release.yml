name: Sürüm yayınla

# "v0.3.0" gibi bir etiket gönderince çalışır: Windows'ta derler, imzalar,
# kurulum dosyasını ve latest.json'u GitHub Releases'e yükler.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      # Derleme kanıtı (attestation): GitHub, kurulum dosyasının bu depodaki koddan bu iş akışıyla derlendiğini imzalar.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: pnpm install --no-frozen-lockfile
      - name: Release oluştur
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" --title "Celeste Overlay ${{ github.ref_name }}" --notes "Yenilikler için sürüm notlarına bak."
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Celeste Overlay ${{ github.ref_name }}"
          releaseBody: "Yenilikler için sürüm notlarına bak."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Kurulum dosyasının parmak izi (SHA256) ve GitHub'ın derleme kanıtı.
      # Doğrulama: PowerShell'de Get-FileHash <dosya>  ·  gh attestation verify <dosya> -R ${{ github.repository }}
      - name: Parmak izi
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/nsis
          ls -1 *.exe
          # GitHub, yüklenen dosya adındaki boşlukları noktaya çevirir; liste indirilen adla yazılır.
          : > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          for f in *.exe; do
            h=$(sha256sum "$f" | cut -d' ' -f1 | tr 'a-f' 'A-F')
            echo "$h  ${f// /.}" >> "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          done
          cat "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          {
            echo "### Parmak izi (SHA256)"
            echo '```'
            cat "$GITHUB_WORKSPACE/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Derleme kanıtı
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "src-tauri/target/release/bundle/nsis/*.exe"
      - name: Parmak izini sürüme ekle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release upload "$tag" SHA256SUMS.txt --clobber
          body=$(gh release view "$tag" --json body -q .body)
          case "$body" in *"## Doğrulama"*) exit 0 ;; esac
          file=$(head -n1 SHA256SUMS.txt | cut -d' ' -f3-)
          hash=$(head -n1 SHA256SUMS.txt | cut -d' ' -f1)
          printf '%s\n\n## Doğrulama\n\nKurulum dosyası GitHub'"'"'ın sunucularında, bu depodaki açık koddan derlendi ve GitHub tarafından mühürlendi.\n\n**SHA256:** `%s`\n\nİndirdiğin dosyayı kontrol et (PowerShell):\n```\nGet-FileHash .\\%s\n```\nÇıkan değer yukarıdakiyle aynıysa dosya birebir aynıdır.\n\nGitHub mührünü kontrol et ([GitHub CLI](https://cli.github.com) ile):\n```\ngh attestation verify %s -R ${{ github.repository }}\n```\n' "$body" "$hash" "$file" "$file" > notes.md
          gh release edit "$tag" --notes-file notes.md
